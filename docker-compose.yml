version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart-traffic-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: smart-traffic-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart_traffic
      - JWT_SECRET=docker_production_jwt_secret_value_998877
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: smart-traffic-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
